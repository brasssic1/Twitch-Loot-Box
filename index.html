<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Streamer.bot Loot Box Collections</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121218; color: #fff; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        h1 { color: #FFC107; margin-bottom: 5px; }
        .search-box { margin: 20px 0; width: 100%; max-width: 500px; display: flex; gap: 10px; }
        input { flex: 1; padding: 10px 15px; background: #1c1c26; border: 1px solid #333; color: #fff; border-radius: 6px; font-size: 16px; }
        button { padding: 10px 20px; background: #FFC107; border: none; font-weight: bold; border-radius: 6px; cursor: pointer; color: #121218; }
        .container { width: 100%; max-width: 950px; margin-top: 20px; }
        
        /* Collection Grouping */
        .collection-section { margin-bottom: 30px; }
        .collection-title { color: #FFC107; font-size: 18px; border-bottom: 2px solid #2a2a38; padding-bottom: 5px; margin-bottom: 15px; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }
        
        /* Card Styles */
        .card { background: #1a1a24; border: 1px solid #333; border-radius: 8px; padding: 12px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.5); transition: transform 0.2s; }
        .card img { max-width: 90px; max-height: 90px; object-fit: contain; margin-bottom: 8px; }
        .item-name { font-weight: bold; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .item-meta { font-size: 12px; color: #888; margin-top: 4px; }
        
        /* Locked / Unowned State */
        .card.locked { opacity: 0.35; filter: grayscale(100%); border: 1px dashed #444; }
        .card.locked .item-name { color: #888; }
        
        .search-result-item { background: #1a1a24; padding: 12px; margin-bottom: 8px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid #FFC107; }
        .back-btn { background: transparent; color: #FFC107; border: 1px solid #FFC107; margin-bottom: 15px; }
    </style>
</head>
<body>

    <h1>🎮 Loot Box Collections</h1>
    <p id="subtitle">Search viewer inventories or view specific collections.</p>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search item name or viewer..." onkeyup="handleSearch(event)">
        <button onclick="performSearch()">Search</button>
    </div>

    <div class="container" id="contentArea">
        <p style="text-align: center; color: #888;">Loading database...</p>
    </div>

<script>
    let globalDb = null;

    async function loadDatabase() {
        try {
            let response = await fetch('db.json?t=' + Date.now());
            globalDb = await response.json();
            
            const urlParams = new URLSearchParams(window.location.search);
            const userParam = urlParams.get('user');

            if (userParam) {
                showUserInventory(userParam);
            } else {
                showHomeView();
            }
        } catch (e) {
            document.getElementById('contentArea').innerHTML = `<p style="color: #ff5252; text-align: center;">Failed to load database. Make sure db.json is uploaded!</p>`;
        }
    }

    function showHomeView() {
        document.getElementById('subtitle').innerText = "Explore all active viewer collections.";
        let html = `<h3>Active Collectors:</h3><div style="display: flex; flex-wrap: wrap; gap: 10px;">`;
        
        if (globalDb && globalDb.Inventories) {
            for (let username in globalDb.Inventories) {
                let count = globalDb.Inventories[username].length;
                html += `<a href="?user=${username}" style="background:#1c1c26; padding:10px 15px; border-radius:6px; color:#FFC107; text-decoration:none; border:1px solid #333;">${username} (${count} items unlocked)</a>`;
            }
        }
        html += `</div>`;
        document.getElementById('contentArea').innerHTML = html;
    }

    function showUserInventory(username) {
        document.getElementById('subtitle').innerText = `Viewing collection for: @${username}`;
        let userKey = Object.keys(globalDb.Inventories).find(k => k.toLowerCase() === username.toLowerCase());
        
        let html = `<button class="back-btn" onclick="window.location.href=window.location.pathname">⬅ Back to Home</button>`;
        
        // Get list of item names the user currently owns
        let userOwnedNames = new Set();
        if (userKey && globalDb.Inventories[userKey]) {
            globalDb.Inventories[userKey].forEach(i => userOwnedNames.add(i.ItemName.toLowerCase()));
        }

        // Group master items by Collection
        let collections = {};
        if (globalDb && globalDb.Items) {
            globalDb.Items.forEach(item => {
                let coll = item.Collection || "Default";
                if (!collections[coll]) collections[coll] = [];
                collections[coll].push(item);
            });
        }

        let unlockedCount = userOwnedNames.size;
        let totalCount = globalDb.Items.length;
        html += `<p style="color: #bbb; margin-bottom: 20px;">Completion Progress: <strong>${unlockedCount} / ${totalCount}</strong> items unlocked</p>`;

        // Render each collection section
        for (let collName in collections) {
            html += `<div class="collection-section">
                        <div class="collection-title">📦 ${collName}</div>
                        <div class="grid">`;
            
            collections[collName].forEach(item => {
                let isOwned = userOwnedNames.has(item.Name.toLowerCase());
                let cardClass = isOwned ? "card" : "card locked";
                let statusText = isOwned ? `<span style="color: #4CAF50; font-size: 11px;">Unlocked</span>` : `<span style="color: #888; font-size: 11px;">Locked</span>`;

                html += `
                    <div class="${cardClass}">
                        <img src="${item.ImagePath}" onerror="this.src='images/placeholder.png'; this.onerror=null;">
                        <div class="item-name">${item.Name}</div>
                        <div class="item-meta">${item.Rarity}</div>
                        <div style="margin-top: 6px;">${statusText}</div>
                    </div>
                `;
            });

            html += `</div></div>`;
        }

        document.getElementById('contentArea').innerHTML = html;
    }

    function performSearch() {
        let query = document.getElementById('searchInput').value.trim().toLowerCase();
        if (!query || !globalDb) return;

        let html = `<button class="back-btn" onclick="showHomeView()">⬅ Back to Home</button><h3>Search Results for "${query}":</h3>`;
        let resultsFound = false;

        for (let username in globalDb.Inventories) {
            globalDb.Inventories[username].forEach(item => {
                if (username.toLowerCase().includes(query) || item.ItemName.toLowerCase().includes(query) || item.Collection.toLowerCase().includes(query)) {
                    resultsFound = true;
                    html += `
                        <div class="search-result-item">
                            <div>
                                <strong>@${username}</strong> unlocked <strong>${item.ItemName}</strong> (${item.Rarity} - ${item.Collection})
                            </div>
                            <a href="?user=${username}" style="color: #FFC107; font-size: 13px;">View Profile</a>
                        </div>
                    `;
                }
            });
        }

        if (!resultsFound) {
            html += `<p style="color: #888;">No matches found.</p>`;
        }

        document.getElementById('contentArea').innerHTML = html;
    }

    function handleSearch(e) {
        if (e.key === 'Enter') performSearch();
    }

    loadDatabase();
</script>
</body>
</html>
